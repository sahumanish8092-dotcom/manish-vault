/* Tiny animated overlays: the artwork itself remains untouched. */
#scan{position:absolute;inset:0;pointer-events:none;opacity:.11;
  background:linear-gradient(to bottom,transparent 0%,rgba(0,255,255,.18) 49%,transparent 51%);
  background-size:100% 34%;animation:scan 6s linear infinite;mix-blend-mode:screen}
@keyframes scan{from{transform:translateY(-110%)}to{transform:translateY(310%)}}
#stars{position:absolute;inset:0;pointer-events:none;opacity:.18}
.zone{position:absolute;border:0;background:transparent;outline:none;color:transparent;caret-color:var(--cyan);}
#username{left:9.2%;top:51.4%;width:81%;height:9.1%;padding:0 9%;font-size:4vw;max-font-size:22px}
#password{left:9.2%;top:59.2%;width:81%;height:9.1%;padding:0 9%;font-size:4vw;max-font-size:22px;caret-color:#e16aff}
#username:focus,#password:focus{box-shadow:inset 0 0 0 1px rgba(0,240,255,.55),0 0 14px rgba(0,230,255,.18);}
#password:focus{box-shadow:inset 0 0 0 1px rgba(216,90,255,.55),0 0 14px rgba(216,90,255,.18)}
.hit{position:absolute;cursor:pointer;background:transparent;border:0;padding:0;}
#unlock{left:19.2%;top:67.2%;width:61.4%;height:7.3%}
#finger{left:14.5%;top:76.3%;width:72.1%;height:7.3%}
#forgot{left:25.5%;top:85.4%;width:49%;height:4.5%}
#status{position:absolute;left:7.5%;top:42.0%;width:85%;height:7.0%;}
.toast{position:absolute;left:50%;bottom:2.7%;transform:translateX(-50%) translateY(16px);
  min-width:58%;padding:10px 16px;border-radius:11px;background:rgba(0,10,18,.92);
  color:#cfffff;border:1px solid var(--cyan);box-shadow:0 0 18px rgba(0,220,255,.25);
  text-align:center;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:700px){
 #username,#password{font-size:22px}
}
</style>
</head>
<body>
<div id="screen">
  <div id="scan"></div>
  <div id="stars"></div>

  <form id="loginForm" autocomplete="off" onsubmit="return false;">
    <input id="username" class="zone" aria-label="Username" autocomplete="username">
    <input id="password" class="zone" aria-label="Password" type="password" autocomplete="current-password">
  </form>

  <button id="unlock" class="hit" aria-label="Unlock Vault"></button>
  <button id="finger" class="hit" aria-label="Fingerprint Protection"></button>
  <button id="forgot" class="hit" aria-label="Forgot Password"></button>
  <div id="status" aria-hidden="true"></div>
  <div id="toast" class="toast"></div>
</div>

<script>
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'),1800);
}

document.getElementById('unlock').addEventListener('click',()=>{
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  if(!u || !p) {
    showToast('ENTER USERNAME AND PASSWORD');
    (!u ? document.getElementById('username') : document.getElementById('password')).focus();
    return;
  }
  showToast('AUTHENTICATING VAULT…');
});

document.getElementById('finger').addEventListener('click',()=>{
  if (window.PublicKeyCredential) showToast('BIOMETRIC AUTHENTICATION REQUESTED');
  else showToast('FINGERPRINT AUTHENTICATION REQUESTED');
});

document.getElementById('forgot').addEventListener('click',()=>showToast('PASSWORD RECOVERY INTERFACE'));

for (const el of [document.getElementById('username'),document.getElementById('password')]) {
  el.addEventListener('focus',()=>el.style.color='rgba(220,255,255,.95)');
  el.addEventListener('blur',()=>el.style.color='transparent');
}
</script>
</body>
</html>
